<text x="44" y="215" class="mono body" font-size="13.5" xml:space="preserve"><tspan fill="#22d3ee" font-weight="700">LLMs    </tspan>— agentic RAG pipelines, multi-agent assistants and multi-model AI interfaces.</text>
<text x="44" y="236" class="mono body" font-size="13.5" xml:space="preserve"><tspan fill="#22d3ee" font-weight="700">WEB     </tspan>— full-stack web applications that put these models in front of real users.</text>
