<text x="44" y="80" class="mono body" font-size="13.5" xml:space="preserve">Hey, I&#x27;m Burak — a Computer Engineering graduate of Dokuz Eylül University (İzmir, 2026).</text>
<text x="44" y="101" class="mono body" font-size="13.5" xml:space="preserve">I build AI-powered software end to end: from model training to the app people actually use.</text>
