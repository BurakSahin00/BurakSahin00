name: Contribution Chart

on:
  schedule:
    - cron: "0 21 * * *"   # her gece 00:00 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/contrib_svg.py --user ${{ github.repository_owner }} --style flat --out assets/contrib.svg
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/contrib.svg
          if git commit -m "update contribution chart"; then
            git push
          fi
